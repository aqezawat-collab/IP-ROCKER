name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # The Kotlin half cannot be compiled on the dev host (no SDK), so this
      # cheap syntax/symbol check runs here too and fails before the much slower
      # Android job starts.
      - name: Check Android sources for syntax and symbol errors
        run: python3 scripts/verify-kotlin-braces.py

      - name: Test
        run: go test -race ./...

      - name: Build CLI for every target
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o /dev/null ./cmd/iprocker
          done

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018" > /dev/null

      - name: Resolve APK version
        id: v
        run: |
          # A debug APK built from a tag push carries the release version; any
          # other build is a dev build named after the commit. Either way the
          # APK no longer falls back to the hardcoded 1.0.0, so Settings shows
          # which build is actually installed.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
            VER="${VER#.}"
          else
            VER="dev-$(git rev-parse --short=7 HEAD)"
          fi
          CODE=$(git rev-list --count HEAD)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Build Go core into an AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          chmod +x android/build_aar.sh
          ./android/build_aar.sh

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iprocker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
