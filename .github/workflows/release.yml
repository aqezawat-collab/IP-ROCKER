name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (e.g. 1.5.0)
        required: true
        default: 1.5.0

permissions:
  contents: write

jobs:
  # Resolve a single version string from either the dispatch input or the pushed
  # tag (the repo tags as v.1.X.0, so strip the leading "v.").
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v.}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $v"

  cli:
    needs: version
    uses: ./.github/workflows/build-cli.yml
    with:
      version: ${{ needs.version.outputs.version }}

  gui:
    needs: version
    uses: ./.github/workflows/build-gui.yml
    with:
      version: ${{ needs.version.outputs.version }}

  android:
    needs: version
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    needs: [cli, gui, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v.${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: IP-ROCKER v.${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
